<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صناع المال - تحت الصيانة</title>
    <!-- استدعاء خط تجوال لدعم اللغة العربية بشكل أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        
        .container {
            max-width: 600px;
            padding: 50px 40px;
            background-color: #1a1a1a;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            margin: 20px;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
            /* لون ذهبي يتناسب مع المنصات المالية */
            color: #f39c12; 
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #ffffff;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #a0a0a0;
            margin-bottom: 35px;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid #f39c12;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* استجابة الشاشات الصغيرة */
        @media (max-width: 480px) {
            h1 { font-size: 26px; }
            p { font-size: 16px; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚙️</div>
        <h1>الموقع تحت الصيانة</h1>
        <p>نحن نعمل حالياً على تحديث وتطوير منصة <strong>صناع المال</strong> لتقديم تجربة وميزات أفضل. سنعود للعمل في أقرب وقت ممكن، شكراً لتفهمكم وصبركم.</p>
        <div class="loader"></div>
    </div>

</body>
</html>
