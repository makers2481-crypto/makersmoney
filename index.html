<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction | تحت الإنشاء</title>
    <style>
        /* إعدادات عامة للصفحة */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        /* صندوق المحتوى */
        .container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 85%;
        }

        /* الأيقونة */
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        /* إعدادات الأقسام */
        .en-section, .ar-section {
            margin: 20px 0;
        }

        /* القسم الإنجليزي */
        .en-section {
            direction: ltr;
        }

        /* القسم العربي */
        .ar-section {
            direction: rtl;
            font-family: Tahoma, Arial, sans-serif; /* خط مناسب للعربية */
        }

        /* العناوين والنصوص */
        h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            color: #2c3e50;
        }

        p {
            margin: 0;
            font-size: 16px;
            color: #666;
            line-height: 1.6;
        }

        /* فاصل بين اللغتين */
        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 30px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- أيقونة تعبيرية -->
        <div class="icon">🚧</div>

        <!-- القسم الإنجليزي -->
        <div class="en-section">
            <h1>Website Under Construction</h1>
            <p>We are currently working on something awesome. We'll be back soon!</p>
        </div>

        <div class="divider"></div>

        <!-- القسم العربي -->
        <div class="ar-section">
            <h1>الموقع تحت الإنشاء</h1>
            <p>نحن نعمل حالياً على إعداد شيء رائع. سنعود قريباً!</p>
        </div>
    </div>

</body>
</html>
